</head>
<body>
  <header>
    <h1>Contact Me</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <button class="dark-toggle" onclick="toggleDarkMode()">🌙</button>
  </header>

  <main>
    <section>
      <h2>Let’s Connect 🤝</h2>
      <p style="text-align:center; margin-bottom:20px;">
        I’d love to hear from you! Whether it's a job opportunity, project collaboration, or just a friendly hello.
      </p>

      <!-- Contact Links -->
    <div class="card contact-links fade-in">
  <!-- Email -->
  <a href="mailto:nandhinisy@gmail.com" title="Email">
    <i class="fas fa-envelope"></i>
  </a>

  <!-- Phone -->
  <a href="tel:+918925645177" title="Phone">
    <i class="fas fa-phone-alt"></i>
  </a>

  <!-- LinkedIn -->
  <a href="https://www.linkedin.com/in/yoganandhini-s-63194b294/" target="_blank" title="LinkedIn">

</div>


      <!-- Working Contact Form -->
      <div class="card fade-in" style="margin-top:30px;">
        <h3 style="text-align:center; margin-bottom:15px;">📩 Send Me a Message</h3>
        <form action="https://formspree.io/f/mvgqnobp" method="POST">

        <form id="contactForm">
  <input type="text" name="name" placeholder="Your Name" required>
  <input type="email" name="email" placeholder="Your Email" required>
  <textarea name="message" placeholder="Your Message" rows="5" required></textarea>
  <button type="submit" class="resume-btn">Send Message</button>
</form>

<!-- Success Message -->
<p id="successMsg" style="display:none; color: #4CAF50; font-weight:bold; text-align:center; margin-top:10px;">
  ✅ Message Sent Successfully!
</p>

      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Yoganandhini S | Portfolio</p>
  </footer>

  <script>
  // Dark Mode (already in your code)
  function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");
    if (document.body.classList.contains("dark-mode")) {
      localStorage.setItem("theme", "dark");
    } else {
      localStorage.setItem("theme", "light");
    }
  }
  window.onload = () => {
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
    }
  };

  // Contact Form Handling
  const form = document.getElementById("contactForm");
  const successMsg = document.getElementById("successMsg");

  form.addEventListener("submit", async function(event) {
    event.preventDefault(); // stop normal submit

    const formData = new FormData(form);

    try {
      const response = await fetch("https://formspree.io/f/mvgqnobp", {
        method: "POST",
        body: formData,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        successMsg.style.display = "block";   // show success message
        form.reset();                         // clear form
      } else {
        alert("❌ Oops! Something went wrong. Try again.");
      }
    } catch (error) {
      alert("⚠️ Network error, please try later.");
    }
  });
</script>

</body>
</html>
